[package]
name = "destination"
version = "0.1.2"
edition = "2024"
authors = ["Erik Rose <erose@grantspassoregon.gov>"]
description = "A library providing types and method for managing physical addresses in a municipality."
repository = "https://github.com/grantspassoregon/destination"
license = "Apache-2.0"
keywords = ["address", "government", "parser"]
categories = [
  "command-line-utilities",
  "parser-implementations",
  "science::geo",
]

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "destination"

[features]
ci = []

[dependencies]
anyhow = "1"
bears_species = { path = "../bears/bears_species" }
bincode = { version = "2.0.1", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
convert_case = "0.11"
csv = "1.4"
derive-getters = "0.5"
derive-new = "0.7"
derive_more = { version = "2", features = ["full"] }
derive_setters = "0.1"
elicitation = { path = "../elicitation/crates/elicitation/", features = [
  "uuid",
] }
elicit_uuid = { path = "../elicitation/crates/elicit_uuid/" }
indicatif = { version = "0.18", features = ["rayon"] }
nom = "8"
rayon = "1.11"
rmcp = "1.2"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
criterion = "0.8"
plotters = "0.3"
test-log = { version = "0.2", features = ["trace"] }

[[bench]]
name = "compare_records"
harness = false

[profile.bench]
debug = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
